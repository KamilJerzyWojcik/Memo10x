name: Main - CI, Docker image & DigitalOcean deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  frontend-build:
    name: Frontend (React/Vite) - build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: memo-words

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: memo-words/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

  frontend-tests:
    name: Frontend (React/Vite) - lint & unit tests
    runs-on: ubuntu-latest
    needs: frontend-build

    defaults:
      run:
        working-directory: memo-words

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: memo-words/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests (Vitest)
        env:
          CI: 'true'
        run: npm test

  backend-build:
    name: Backend (.NET 9) - build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MemoWords

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build solution (Release)
        run: dotnet build --configuration Release --no-restore

  backend-tests:
    name: Backend (.NET 9) - tests (xUnit)
    runs-on: ubuntu-latest
    needs: backend-build

    defaults:
      run:
        working-directory: MemoWords

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build solution (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Run tests (xUnit)
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: dotnet test --configuration Release --no-build

  build-and-push-image:
    name: Build & push Docker image to GHCR
    runs-on: ubuntu-latest
    needs:
      - frontend-tests
      - backend-tests

    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: memowords

      PUBLIC_ENV_NAME: ${{ secrets.PUBLIC_ENV_NAME || 'production' }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/kamiljerzywojcik/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/kamiljerzywojcik/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            PUBLIC_ENV_NAME=${{ env.PUBLIC_ENV_NAME }}
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_SUPABASE_URL=${{ env.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ env.VITE_SUPABASE_ANON_KEY }}

  deploy-digitalocean:
    name: Deploy to DigitalOcean App Platform
    runs-on: ubuntu-latest
    needs: build-and-push-image

    # Deploy tylko na push do main + workflow_dispatch
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Trigger App Platform deployment
        run: |
          # Założenie: aplikacja App Platform jest skonfigurowana tak,
          # by używać obrazu:
          # ghcr.io/${GITHUB_OWNER}/${IMAGE_NAME}:latest
          # Nowy deployment wymusi pobranie najnowszego :latest
          doctl apps create-deployment ${{ secrets.DIGITALOCEAN_APP_ID }}


