name: Pull Request Quality Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memo-words

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: memo-words/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  unit-tests:
    name: Unit tests & coverage
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: memo-words

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: memo-words/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Vitest with coverage
        env:
          CI: 'true'
        run: npm run test -- --coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: memo-words/coverage
          if-no-files-found: error

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore .NET dependencies
        working-directory: MemoWords
        run: dotnet restore

      - name: Run .NET tests with coverage
        working-directory: MemoWords
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: dotnet test --configuration Release --collect "XPlat Code Coverage" --results-directory TestResults

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage
          path: MemoWords/TestResults
          if-no-files-found: error

  e2e-tests:
    name: Playwright e2e & coverage
    runs-on: ubuntu-latest
    needs: lint
    environment:
      name: integration
    defaults:
      run:
        working-directory: memo-words
    env:
      ASPNETCORE_ENVIRONMENT: Integration
      ASPNETCORE_URLS: http://127.0.0.1:7048
      LOCAL_API_URL: http://127.0.0.1:7048
      VITE_API_BASE_URL: http://127.0.0.1:7048
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_E2E_USERNAME_ID: ${{ secrets.VITE_E2E_USERNAME_ID }}
      VITE_E2E_USERNAME: ${{ secrets.VITE_E2E_USERNAME }}
      VITE_E2E_PASSWORD: ${{ secrets.VITE_E2E_PASSWORD }}
      ConnectionStrings__Default: ${{ secrets.CONNECTIONSTRINGS_DEFAULT }}
      Supabase__Url: ${{ secrets.SUPABASE_URL }}
      Supabase__JwtSecret: ${{ secrets.SUPABASE_JWT_SECRET }}
      OpenAI__BaseUrl: ${{ secrets.OPENAI_BASE_URL }}
      OpenAI__ModelName: ${{ secrets.OPENAI_MODEL_NAME }}
      OpenAI__ApiKey: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore backend dependencies
        working-directory: MemoWords
        run: dotnet restore

      - name: Build backend (Release)
        working-directory: MemoWords
        run: dotnet build --configuration Release --no-restore

      - name: Run backend API (integration)
        working-directory: MemoWords/MemoWords.Api
        env:
          ConnectionStrings__Default: ${{ secrets.CONNECTIONSTRINGS_DEFAULT }}
          Supabase__Url: ${{ secrets.SUPABASE_URL }}
          Supabase__JwtSecret: ${{ secrets.SUPABASE_JWT_SECRET }}
          OpenAI__BaseUrl: ${{ secrets.OPENAI_BASE_URL }}
          OpenAI__ModelName: ${{ secrets.OPENAI_MODEL_NAME }}
          OpenAI__ApiKey: ${{ secrets.OPENAI_API_KEY }}
        run: |
          dotnet run --configuration Release --no-build --urls $ASPNETCORE_URLS >/tmp/backend.log 2>&1 &
          echo $! > /tmp/backend-pid

      - name: Wait for backend readiness
        run: |
          for i in {1..60}; do
            if curl -kfsS "$LOCAL_API_URL/health" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend API did not become ready in time" >&2
          echo "Last 100 lines of backend log:" >&2
          tail -n 100 /tmp/backend.log >&2 || true
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: memo-words/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright with coverage
        env:
          CI: 'true'
        run: |
          npx c8 --reporter=lcov --reporter=text-summary --report-dir coverage-e2e -- \
            npm run e2e -- --project=chromium --workers=1 --reporter=line --config=playwright.config.ts

      - name: Upload e2e coverage
        uses: actions/upload-artifact@v4
        with:
          name: playwright-coverage
          path: memo-words/coverage-e2e
          if-no-files-found: error

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: memo-words/playwright-report
          if-no-files-found: warn

      - name: Stop backend API
        if: always()
        run: |
          if [ -f /tmp/backend-pid ]; then
            kill $(cat /tmp/backend-pid) || true
          fi

  status-comment:
    name: PR status comment
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-tests
      - e2e-tests
    if: >
      needs.lint.result == 'success' &&
      needs['unit-tests'].result == 'success' &&
      needs['e2e-tests'].result == 'success'

    steps:
      - name: Add status comment
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = [
              '## ✅ Pull Request Quality Gate',
              '',
              '- ESLint: **pass**',
              '- Unit tests & coverage: **pass**',
              '- Playwright e2e & coverage: **pass**',
              '',
              'Artifacts:',
              '- `vitest-coverage` (frontend)',
              '- `dotnet-coverage` (backend)',
              '- `playwright-coverage` + `playwright-report` (e2e)',
            ].join('\n')

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody,
            })

