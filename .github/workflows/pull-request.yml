name: Pull Request Quality Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memo-words

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: memo-words/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  frontend-unit-tests:
    name: Frontend unit tests & coverage
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: memo-words

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: memo-words/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Vitest with coverage
        env:
          CI: 'true'
        run: npm run test -- --coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: memo-words/coverage
          if-no-files-found: error

  backend-unit-tests:
    name: Backend unit tests (xUnit) & coverage
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: MemoWords

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Run backend unit tests (xUnit) with coverage
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: dotnet test --configuration Release --collect "XPlat Code Coverage" --results-directory TestResults

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage
          path: MemoWords/TestResults
          if-no-files-found: error

  status-comment:
    name: PR status comment
    runs-on: ubuntu-latest
    needs:
      - lint
      - frontend-unit-tests
      - backend-unit-tests
    if: >
      needs.lint.result == 'success' &&
      needs['frontend-unit-tests'].result == 'success' &&
      needs['backend-unit-tests'].result == 'success'

    steps:
      - name: Add status comment
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = [
              '## ✅ Pull Request Quality Gate',
              '',
              '- ESLint (frontend): **pass**',
              '- Unit tests & coverage (frontend): **pass**',
              '- Unit tests & coverage (backend xUnit): **pass**',
              '',
              'Artifacts:',
              '- `vitest-coverage` (frontend)',
              '- `dotnet-coverage` (backend)',
            ].join('\n')

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody,
            })

