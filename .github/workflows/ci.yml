name: CI - build & tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  frontend-tests:
    name: Frontend (React/Vite) - tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: memo-words

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: memo-words/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (Vitest)
        run: npm test

  frontend-build:
    name: Frontend (React/Vite) - build
    runs-on: ubuntu-latest
    needs: frontend-tests

    defaults:
      run:
        working-directory: memo-words

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: memo-words/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

  backend-tests:
    name: Backend (.NET 9) - tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MemoWords

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build solution (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Run tests (xUnit)
        run: dotnet test --configuration Release --no-build

  backend-build:
    name: Backend (.NET 9) - build
    runs-on: ubuntu-latest
    needs: backend-tests

    defaults:
      run:
        working-directory: MemoWords

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build solution (Release)
        run: dotnet build --configuration Release --no-restore